name: Build Mod from Zip

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Eliminamos la línea de cache: 'gradle' para evitar el error de archivos no encontrados

    - name: Unzip Source
      run: |
        if [ -f "isla-dragoncitos-mod-FULL_SOURCE.zip" ]; then
          unzip isla-dragoncitos-mod-FULL_SOURCE.zip -d .
          echo "ZIP descomprimido correctamente."
        else
          echo "Error: No se encontró el archivo isla-dragoncitos-mod-FULL_SOURCE.zip en la raíz del repositorio."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: build/libs/*.jar

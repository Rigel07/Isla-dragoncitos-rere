name: Build Mod Final V3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source
      run: |
        set +e
        ZIP_FILE=$(ls *.zip | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP found"
          exit 1
        fi
        unzip -oq "$ZIP_FILE" -d . || true

    - name: Find and Move to Gradle Folder
      run: |
        GRADLE_DIR=$(find . -name gradlew -exec dirname {} \; | head -n 1)
        if [ -z "$GRADLE_DIR" ]; then
          echo "Error: gradlew not found"
          exit 1
        fi
        echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

    - name: Build with Gradle
      run: |
        cd ${{ env.GRADLE_DIR }}
        chmod +x gradlew
        ./gradlew build

    - name: Upload Build Artifact
      run: |
        # Use a shell command to find the jar regardless of folder structure
        JAR_PATH=$(find . -name "*.jar" | grep "build/libs" | head -n 1)
        echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: "**/*.jar"

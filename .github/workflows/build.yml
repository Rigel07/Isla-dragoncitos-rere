name: Build Mod Final Fix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Fix Paths
      run: |
        set +e
        ZIP_FILE=$(ls *.zip | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP found"
          exit 1
        fi
        echo "Descomprimiendo $ZIP_FILE..."
        # Usamos unzip pero ignoramos el código de salida para que no detenga el build
        unzip -oq "$ZIP_FILE" -d . || true
        echo "Descompresión finalizada (ignorando warnings de Windows)."

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build || (echo "Build falló, intentando limpieza..." && ./gradlew clean build)

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: build/libs/*.jar

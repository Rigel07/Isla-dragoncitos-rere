name: Build Mod from Zip

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source (Forced)
      run: |
        if [ -f "isla-dragoncitos-mod-FULL_SOURCE.zip" ]; then
          # -o fuerza la sobrescritura de archivos existentes sin preguntar
          # -q modo silencioso para evitar warnings de rutas
          unzip -oq isla-//dragoncitos-mod-FULL_SOURCE.zip -d .
          echo "ZIP descomprimido y archivos forzados correctamente."
        else
          echo "Error: No se encontró el archivo ZIP en la raíz."
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: build/libs/*.jar

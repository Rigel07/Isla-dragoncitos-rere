name: Build Mod from Zip

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source (Fixed Name)
      run: |
        # Buscamos cualquier archivo que termine en .zip en la raíz para evitar errores de tipeo
        ZIP_FILE=$(ls *.zip | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No se encontró ningún archivo .zip en la raíz del repositorio."
          exit 1
        fi
        echo "Descomprimiendo $ZIP_FILE..."
        unzip -oq "$ZIP_FILE" -d .
        echo "ZIP descomprimido correctamente."

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-JAR
        path: build/libs/*.jar
